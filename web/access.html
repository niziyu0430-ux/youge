<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f5f0"><meta name="robots" content="noindex,nofollow">
  <title>输入访问密码 · 游格</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/access.css">
</head>
<body class="access-page">
  <header class="access-header"><div class="wordmark"><img src="/assets/mark.svg" alt="" width="42" height="42"><span>游格<small>PLAYER ATLAS</small></span></div><span class="access-header-note">一款游戏，很多种喜欢。</span></header>
  <main class="access-main">
    <section class="access-card" aria-labelledby="access-title">
      <p class="access-eyebrow">YOUR PLAYER IDENTITY</p>
      <h1 id="access-title">开启你的玩家档案。</h1>
      <p class="access-intro">输入你收到的访问密码，<br>从本命游戏开始，认识玩家版的自己。</p>
      <form id="access-form" method="post" action="/api/access/login" autocomplete="on">
        <label for="access-password">访问密码</label>
        <div class="access-input-wrap"><input id="access-password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="输入访问密码" required aria-describedby="access-message access-refresh"><button id="show-password" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <p id="access-message" role="alert" hidden></p>
        <button id="access-submit" class="primary-button" type="submit"><span>解锁我的玩家档案</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </form>
      <div class="access-details"><p><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>登录后可不限次数测试</p><p id="access-refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 7M19 3v6h-6"/></svg>刷新或重新打开页面后，需要再次登录</p></div>
    </section>
    <aside class="access-illustration" aria-label="游格原创玩家角色"><div class="access-orbit"></div><img src="/assets/personas-hero/v2/wanderer.webp" alt="背着地图与行囊、准备探索的游格原创角色" width="640" height="960" fetchpriority="low"><div class="access-quote"><span>每一种喜欢，</span><strong>都藏着一点你的样子。</strong></div></aside>
  </main>
  <footer class="access-footer">游格 · 让每一种玩法，都有自己的角色。</footer>
  <script type="module" src="/access.js"></script>
</body>
</html>
