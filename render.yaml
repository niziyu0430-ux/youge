services:
  - type: web
    name: youge
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py 'youge.production:create_app()'
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: YOUGE_ACCESS_PASSWORD
        sync: false
