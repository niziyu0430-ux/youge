name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_access tests.test_web tests.test_v04 tests.test_production tests.test_recommendations
      - run: gunicorn --check-config --config gunicorn.conf.py 'youge.production:create_app()'
        env:
          YOUGE_ACCESS_PASSWORD: ci-only-test-password
